<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Interface</title>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
      }
      input {
        width: 50%;
        border-radius: 10px;
        height: 40px;
      }
      button {
        width: 5%;
        border-radius: 10px;
        height: 40px;
        background-color: rgb(94, 153, 255);
        color: white;
        font-weight: bolder;
        cursor: pointer;
      }
      #chat-container {
        width: 60%;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <center>
      <h1 style="font-size: 50px"><b>Chatbot For Generic Q/A</b></h1>
      <div id="chat-container">
        <div id="chat-box">
          <ul id="chat-list">
            {% for message in chat_history %}
            <li class="{{ message.sender }}">{{ message.text }}</li>
            {% endfor %}
          </ul>
        </div>
      </div>
      <form id="user-input-form">
        <input type="text" id="user-input" placeholder="Type your query..." />
        <button type="submit">Send</button>
      </form>
    </center>
    <script>
      // JavaScript code to handle form submission
      document.addEventListener("DOMContentLoaded", function () {
        var form = document.getElementById("user-input-form");
        form.addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent default form submission

          var userInput = document.getElementById("user-input").value;
          if (!userInput.trim()) return; // If user input is empty, do nothing

          // Send AJAX request to Flask backend
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/chatbot", true);
          xhr.setRequestHeader(
            "Content-Type",
            "application/x-www-form-urlencoded"
          );
          xhr.onload = function () {
            if (xhr.status === 200) {
              // Update chat interface with user input and bot response
              var chatList = document.getElementById("chat-list");
              chatList.innerHTML += '<li class="user">' + userInput + "</li>";
              chatList.innerHTML +=
                '<li class="bot">' + xhr.responseText + "</li>";
              document.getElementById("user-input").value = ""; // Clear input field
              // Optionally, you can scroll to the bottom of the chat box
              chatList.scrollTop = chatList.scrollHeight;
            } else {
              console.error("Request failed. Status: " + xhr.status);
            }
          };
          xhr.send("user_input=" + encodeURIComponent(userInput));
        });
      });
    </script>
  </body>
</html>
